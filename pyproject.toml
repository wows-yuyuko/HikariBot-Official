[project]
name = "hikari-bot-official"
version = "0.3.0"
description = "Nonebot2 HikariBot For QQ-Official,支持战舰世界水表查询"
authors = [
    {name = "benx1n", email = "shirakamikanade@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = ["nonebot", "nonebot2", "qqbot", "wows", "wws", "bot", "stats"]
dependencies = [
    "nonebot2[fastapi,websockets,httpx] >=2.5.0",
    "nonebot-adapter-qq >=1.7.2",
    "orjson >=3.8.11",
    "oss2 >=2.18.3",
    "httpx[http2] >=0.28.1",
    "APScheduler >=3.10.1",
    "jinja2 >=3.1.6",
    "pydantic >=2.13.4",
    "playwright >=1.62.0",
    "loguru >=0.7.0",
    "pillow >=12.2.0",
    "nb-cli >=1.7.4"
]

[project.urls]
homepage = "https://github.com/benx1n/HikariBot-Official"
repository = "https://github.com/benx1n/HikariBot-Official"

[tool.nonebot]
plugin_dirs = ["hikari_bot/plugins"]

# 依赖源（阿里云为主源，清华/腾讯为回退源）
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[tool.uv]
# 本项目是应用而非待分发的库：uv sync 只安装依赖，不构建/安装本项目自身
package = false

# 以下工具配置保持不变
[tool.isort]
profile = "black"

[tool.black]
line-length = 150
skip-string-normalization = true

[tool.ruff]
line-length = 150
respect-gitignore = true
ignore-init-module-imports = true
select = [
    'F', 'E', 'W', 'I', 'C', 'B', 'Q', 'PL', 'RUF'
]
ignore = [
    'E501', 'RUF001', 'RUF002', 'RUF003', 'PLR2004',
    'C901', 'PLR0912', 'PLR0911', 'PLW0603'
]
flake8-quotes = {inline-quotes = 'single', multiline-quotes = 'double'}