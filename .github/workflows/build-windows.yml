name: Build Windows 离线包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: 构建 Windows 离线运行包
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码（含 hikari_core 子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 micromamba
        run: |
          mkdir -p "$HOME/micromamba-bin"
          curl -LsSf https://micro.mamba.pm/api/micromamba/win-64/latest -o /tmp/mm.tar.bz2
          tar -xjf /tmp/mm.tar.bz2 -C "$HOME/micromamba-bin"
          MMB="$(find "$HOME/micromamba-bin" -name micromamba.exe | head -n1)"
          export PATH="$(dirname "$MMB"):$PATH"
          echo "$(dirname "$MMB")" >> "$GITHUB_PATH"
          micromamba --version

      - name: 创建隔离 Python 3.11 环境
        run: |
          micromamba create -p "$PWD/pyenv" python=3.11 -c conda-forge -y
          micromamba run -p "$PWD/pyenv" python -V

      - name: 安装 uv（仅构建期使用，打包前卸载）
        run: |
          micromamba run -p "$PWD/pyenv" python -m pip install -U uv
          micromamba run -p "$PWD/pyenv" uv --version

      - name: 解析依赖并导出清单
        run: |
          # 仓库不提交 uv.lock，这里现场解析并导出干净的依赖清单（同时会在构建目录生成 uv.lock）
          micromamba run -p "$PWD/pyenv" uv lock
          micromamba run -p "$PWD/pyenv" uv export --no-emit-project --no-hashes -o requirements.txt
          echo "导出依赖条数: $(grep -c '==' requirements.txt)"

      - name: 安装项目依赖到 pyenv
        run: |
          micromamba run -p "$PWD/pyenv" uv pip install \
            --python "$PWD/pyenv/python.exe" \
            --default-index https://pypi.org/simple/ \
            -r requirements.txt
          rm -f requirements.txt

      - name: 安装 Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          micromamba run -p "$PWD/pyenv" python -m playwright install chromium
      - name: conda-pack 打包环境
        run: |
          micromamba run -p "$PWD/pyenv" python -m pip uninstall -y uv
          micromamba run -p "$PWD/pyenv" python -m pip install conda-pack
          rm -f pyenv-packed.tar.gz
          micromamba run -p "$PWD/pyenv" conda-pack -p "$PWD/pyenv" -o pyenv-packed.tar.gz

      - name: 组装离线包目录
        run: |
          mkdir -p dist/HikariBot-Windows/pyenv
          cp -r hikari_bot hikari_core dist/HikariBot-Windows/
          cp bot.py start.bat pyproject.toml README.md LICENSE .env.prod-example dist/HikariBot-Windows/ || true
          tar -xzf pyenv-packed.tar.gz -C dist/HikariBot-Windows/pyenv
          rm -rf dist/HikariBot-Windows/hikari_core/.git
          rm -rf dist/HikariBot-Windows/pyenv/.cache dist/HikariBot-Windows/pyenv/pkgs
          du -sh dist/HikariBot-Windows || echo "Size check skipped"

      - name: 压缩为 zip（使用 7zip）
        run: |
          echo "压缩前目录大小:"
          du -sh dist/HikariBot-Windows || echo "du 不可用"

          # 使用 7zip（Windows Runner 预装）
          cd dist
          7z a -tzip HikariBot-Windows.zip HikariBot-Windows/
          cd ..

          echo "压缩后文件大小:"
          ls -lh dist/HikariBot-Windows.zip || dir dist\\HikariBot-Windows.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HikariBot-Windows
          path: dist/HikariBot-Windows.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HikariBot-Windows.zip
          generate_release_notes: true