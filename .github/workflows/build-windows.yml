name: Build Windows 离线包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: 构建 Windows 离线运行包
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # 这三个目录都会随包分发，用户机器上由 start.bat 指回包内路径
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/uv-python
      UV_CACHE_DIR: ${{ github.workspace }}/uv-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright

    steps:
      - name: 检出代码（含 hikari_core 子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin\uv.exe" --version

      - name: 下载托管 Python 3.11（随包分发）
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.11
          uv python find 3.11

      - name: 解析依赖并同步构建环境
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # 仓库不提交 uv.lock，这里现场解析（同时生成 uv.lock 供随包分发）
          uv lock
          # 同步产物会同时把 wheel 落进 UV_CACHE_DIR，供用户机器离线安装
          uv sync --python 3.11
          echo "依赖条数: $(uv export --no-emit-project --no-hashes -o - | grep -c '==')"

      - name: 安装 Playwright Chromium（随包分发）
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --no-sync playwright install chromium

      - name: 组装离线包目录
        run: |
          PKG=dist/HikariBot-Windows
          rm -rf dist
          mkdir -p "$PKG"
          cp -r hikari_bot hikari_core "$PKG/"
          cp bot.py start.bat pyproject.toml uv.lock README.md LICENSE .env.prod-example "$PKG/" || true
          # 随包分发 uv 可执行文件 + 托管 Python + 依赖缓存 + Chromium
          cp "$HOME/.local/bin/uv.exe" "$PKG/"
          cp -r uv-python uv-cache ms-playwright "$PKG/"
          # .venv 不打包：由用户在首次启动时离线创建，避免打包绝对路径失效
          rm -rf "$PKG/hikari_core/.git"
          echo "构建产物体积:"
          du -sh "$PKG" || echo "Size check skipped"

      - name: 压缩为 zip（使用 7zip）
        run: |
          echo "压缩前目录大小:"
          du -sh dist/HikariBot-Windows || echo "du 不可用"

          # 使用 7zip（Windows Runner 预装）
          cd dist
          7z a -tzip HikariBot-Windows.zip HikariBot-Windows/
          cd ..

          echo "压缩后文件大小:"
          ls -lh dist/HikariBot-Windows.zip || dir dist\\HikariBot-Windows.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HikariBot-Windows
          path: dist/HikariBot-Windows.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HikariBot-Windows.zip
          generate_release_notes: true
